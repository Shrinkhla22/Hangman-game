<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hangman - Game</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        🎮 HANGMAN
    </a>

    <ul class="nav-links">

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="categories.html">Play</a>
        </li>

        <li>
            <a href="leaderboard.html">
                Leaderboard
            </a>
        </li>

        <li>
            <a href="how-to-play.html">
                How to Play
            </a>
        </li>

    </ul>

</header>


<section class="page-header">

    <span class="badge">
        GAME SCREEN
    </span>

    <h1>
        Ready to Guess?
    </h1>

    <p>
        Find the hidden word before your attempts run out.
    </p>

</section>


<main class="container">

    <div class="game-layout">


        <div class="game-box">

            <h2>Hangman</h2>

            <div class="hangman-area">

                <div class="hangman">

                    <div class="gallows-base"></div>

                    <div class="gallows-pole"></div>

                    <div class="gallows-top"></div>

                    <div class="gallows-rope"></div>

                    <div class="head"></div>

                    <div class="body"></div>

                    <div class="arm-left"></div>

                    <div class="arm-right"></div>

                    <div class="leg-left"></div>

                    <div class="leg-right"></div>

                </div>

            </div>

        </div>


        <div class="info-box">

            <span class="category-label">
                CATEGORY: ANIMALS
            </span>


            <div class="word">
                _ _ _ _ _ _
            </div>


            <div class="stats">

                <div class="stat">

                    <span>ATTEMPTS</span>

                    <strong>
                        3 / 6
                    </strong>

                </div>


                <div class="stat">

                    <span>SCORE</span>

                    <strong>
                        120
                    </strong>

                </div>


                <div class="stat">

                    <span>TIME</span>

                    <strong>
                        45s
                    </strong>

                </div>

            </div>


            <h3>
                Choose a Letter
            </h3>


            <div class="keyboard">


                <button class="key">A</button>
                <button class="key">B</button>
                <button class="key">C</button>
                <button class="key">D</button>
                <button class="key">E</button>
                <button class="key">F</button>
                <button class="key">G</button>


                <button class="key">H</button>
                <button class="key">I</button>
                <button class="key">J</button>
                <button class="key">K</button>
                <button class="key">L</button>
                <button class="key">M</button>
                <button class="key">N</button>


                <button class="key">O</button>
                <button class="key">P</button>
                <button class="key">Q</button>
                <button class="key">R</button>
                <button class="key">S</button>
                <button class="key">T</button>
                <button class="key">U</button>


                <button class="key">V</button>
                <button class="key">W</button>
                <button class="key">X</button>
                <button class="key">Y</button>
                <button class="key">Z</button>

            </div>


            <div class="game-buttons">

                <a href="game.html"
                   class="btn secondary">
                    ↻ NEW GAME
                </a>

                <div class="game-buttons">

    <a href="game.html"
       class="btn secondary">
        ↻ NEW GAME
    </a>

</div>

            </div>

        </div>

    </div>

</main>


<footer class="footer">
    © 2026 Hangman Game
</footer>

<script src="js/game.js"></script>

</body>
</html>
